<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program Preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
  --bg-color: #121212;
  --surface-color: #1e1e1e;
  --primary-orange: #f99a00;
  --text-main: #ffffff;
  --text-muted: #a0a0a0;
  --border-radius: 8px;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  padding: 0;
}

.app-container {
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: 100px; /* Espace pour le bouton Save fixe */
}

/* Header */
.header {
  display: flex;
  align-items: center;
  padding: 20px;
  gap: 20px;
}

.back-btn {
  background: var(--primary-orange);
  border: none;
  border-radius: 8px;
  width: 40px;
  height: 40px;
  font-size: 20px;
  cursor: pointer;
}

h1 {
  color: var(--primary-orange);
  font-size: 1.5rem;
  margin: 0;
}

/* Content */
.content {
  padding: 0 20px;
}

.main-title {
  color: var(--primary-orange);
  font-size: 1.1rem;
  margin-bottom: 30px;
}

.season-label {
  color: var(--text-muted);
  font-size: 0.9rem;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

/* Inputs */
.input-group {
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.input-group label {
  font-size: 0.95rem;
  color: var(--text-main);
}

.inputs-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

input[type="number"] {
  background: transparent;
  border: 1.5px solid var(--primary-orange);
  border-radius: var(--border-radius);
  color: var(--primary-orange);
  width: 50px;
  padding: 8px;
  text-align: center;
  font-size: 1rem;
  outline: none;
}

.separator {
  color: var(--primary-orange);
  font-weight: bold;
}

/* Buttons */
.btn-secondary {
  width: 100%;
  background: transparent;
  border: 1px solid var(--primary-orange);
  color: var(--primary-orange);
  padding: 12px;
  border-radius: var(--border-radius);
  margin-top: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.btn-secondary:active {
  background: rgba(249, 154, 0, 0.1);
}

.divider {
  border: none;
  border-top: 1px solid #333;
  margin: 40px 0;
}

/* Footer & Save Button */
.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 500px;
  padding: 20px;
  background: linear-gradient(transparent, var(--bg-color) 20%);
  box-sizing: border-box;
}

.btn-primary {
  width: 100%;
  background: var(--primary-orange);
  border: none;
  padding: 15px;
  border-radius: var(--border-radius);
  color: black;
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
}

.icon {
  margin-right: 8px;
  color: var(--primary-orange);
}
  </style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <button class="back-btn">←</button>
    <h1>Program</h1>
  </header>

  <main class="content">
    <h2 class="main-title">Seasons schedules (summer/winter)</h2>

    <section class="season-section">
      <h3 class="season-label">SUMMER</h3>
      
      <div class="input-group">
        <label>Summer begin (DD/MM)</label>
        <div class="inputs-row">
          <input type="number" value="1" min="1" max="31">
          <span class="separator">/</span>
          <input type="number" value="4" min="1" max="12">
        </div>
      </div>

      <div class="input-group">
        <label><span class="icon">&#9728;</span> Day Time (HH:MM)</label>
        <div class="inputs-row">
          <input type="number" value="8" min="0" max="23">
          <span class="separator">:</span>
          <input type="number" value="0" min="0" max="59">
        </div>
      </div>

      <div class="input-group">
        <label><span class="icon">&#127769;</span> Night Time (HH:MM)</label>
        <div class="inputs-row">
          <input type="number" value="20" min="0" max="23">
          <span class="separator">:</span>
          <input type="number" value="0" min="0" max="59">
        </div>
      </div>

      <button class="btn-secondary">Set Summer température</button>
    </section>

    <hr class="divider">

    <section class="season-section">
      <h3 class="season-label">WINTER</h3>
      
      <div class="input-group">
        <label>Winter begin (DD/MM)</label>
        <div class="inputs-row">
          <input type="number" value="21" min="1" max="31">
          <span class="separator">/</span>
          <input type="number" value="8" min="1" max="12">
        </div>
      </div>

      <div class="input-group">
        <label><span class="icon">&#9728;</span> Day Time</label>
        <div class="inputs-row">
          <input type="number" value="8" min="0" max="23">
          <span class="separator">:</span>
          <input type="number" value="0" min="0" max="59">
        </div>
      </div>

      <div class="input-group">
        <label><span class="icon">&#127769;</span> Night Time</label>
        <div class="inputs-row">
          <input type="number" value="20" min="0" max="23">
          <span class="separator">:</span>
          <input type="number" value="0" min="0" max="59">
        </div>
      </div>

      <button class="btn-secondary">Set Winter température</button>
    </section>
  </main>

  <footer class="footer">
    <button class="btn-primary">Save</button>
  </footer>
</div>
